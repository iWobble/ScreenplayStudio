# Runs the tests. They import the generic Marvin worker, which lives in a separate (public) repository, InnerOpen/marvin-worker.
name: tests
on:
  workflow_dispatch:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { path: ScreenplayStudio }
      - uses: actions/checkout@v4
        with:
          repository: InnerOpen/marvin-worker
          path: MarvinWorker
          token: ${{ secrets.MARVIN_WORKER_TOKEN || github.token }}
      # The mirror can stall for an hour: short network timeouts and retries make a bad moment fail fast or pass on a second try.
      - name: ffmpeg
        timeout-minutes: 5
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y --no-install-recommends ffmpeg && exit 0
            sleep 10
          done
          exit 1
      - uses: astral-sh/setup-uv@v5
      - name: render
        working-directory: ScreenplayStudio/render
        run: uv run --python 3.12 --with pytest --with pytest-timeout --with screenplain==0.12.0 --with reportlab==5.1.0 --with pillow --with-editable . --with-editable ../../MarvinWorker python -m pytest -q --timeout=300
      - name: transcribe
        working-directory: ScreenplayStudio/transcribe
        run: uv run --python 3.12 --with pytest --with pytest-timeout --with-editable . --with-editable ../../MarvinWorker python -m pytest -q --timeout=300

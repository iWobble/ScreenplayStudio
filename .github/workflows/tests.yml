# Runs the tests by hand (Actions -> tests -> Run workflow). The tests import the generic Marvin worker, which lives in a separate repository
# (InnerOpen/marvin-worker); while that is private this needs a MARVIN_WORKER_TOKEN secret, so it is not run on every push yet.
name: tests
on: workflow_dispatch
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ScreenplayStudio }
      - uses: actions/checkout@v4
        with:
          repository: InnerOpen/marvin-worker
          path: MarvinWorker
          token: ${{ secrets.MARVIN_WORKER_TOKEN || github.token }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v5
      - name: render
        working-directory: ScreenplayStudio/render
        run: uv run --with pytest --with screenplain==0.12.0 --with reportlab==5.1.0 --with-editable . --with-editable ../../MarvinWorker python -m pytest -q
      - name: transcribe
        working-directory: ScreenplayStudio/transcribe
        run: uv run --with pytest --with-editable . --with-editable ../../MarvinWorker python -m pytest -q

[project]
name = "storytranscribe"
version = "0.1.0"
description = "Marvin job kind: transcribe an audio asset with faster-whisper (free, local), keeping the text as assets."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
model = ["faster-whisper==1.2.1", "av>=14,<17"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["storytranscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
